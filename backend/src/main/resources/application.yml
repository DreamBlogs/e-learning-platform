spring:
  application:
    name: ai-elearning-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_elearning}
    username: ${DB_USERNAME:ai_learning}
    password: ${DB_PASSWORD:ai_learning}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ai_learning}
    password: ${RABBITMQ_PASSWORD:ai_learning}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:ai-elearning}
      secret: ${JWT_SECRET:dev-jwt-secret-must-be-at-least-256-bits-long-for-hs256-algorithm-change-in-prod}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:60}

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:learning-materials}

  ai:
    groq:
      api-key: ${OPENAI_API_KEY:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.example.learning: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
